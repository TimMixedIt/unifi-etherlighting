name: Tests

on:
  push:
  pull_request:
  schedule:
    - cron: "29 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: minimum Home Assistant
            python: "3.13"
            requirements: requirements_test.txt
          - name: current Home Assistant
            python: "3.14"
            requirements: requirements_test_current.txt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r ${{ matrix.requirements }}
      - run: pytest -q
      - run: ruff check .
